


<!-- templates/keywords.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Keywords Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Keywords Overview</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for keyword, count in keywords %}
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-xl font-semibold mb-2">{{ keyword }}</h2>
                <p class="text-gray-600 mb-4">Total occurrences: {{ count }}</p>
                <div class="space-y-2">
                    <a href="{{ url_for('show_keyword_country', keyword=keyword) }}"
                       class="block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 text-center">
                        View Distribution
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
